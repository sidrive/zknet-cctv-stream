<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contoh aplikasi host</title>
  <style>body{font:15px system-ui;max-width:860px;margin:2rem auto;padding:0 1rem}</style>
</head>
<body>
  <h1>Aplikasi host (contoh)</h1>
  <p>CCTV di bawah ini adalah mini-app yang disematkan lewat <code>embed.js</code>.
     Ubah <code>data-cluster</code> sesuai slug cluster Anda.</p>
  <!-- Ganti origin dengan alamat server CCTV Anda -->
  <script src="/embed.js" data-cluster="lobby" data-height="420"></script>
</body>
</html>
